#
# This docker compose file runs the published MCP image from GHCR.
#
# Run with:
#
# $ docker compose up -d mcp
#
# Then configure the MCP client to connect to http://localhost:3000/mcp
#
services:
  mcp:
    image: ghcr.io/italia/dati-semantic-mcp:latest
    pull_policy: always
    container_name: schema-gov-it-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist usage logs
      - ./logs:/app/logs
      # Mount local ontology files for the local ontology tools (inspect/query/compare).
      # Files placed in ./ontologies/ on the host will be accessible inside the
      # container as /app/ontologies/<filename>.ttl
      # Uncomment the line below to enable:
      # - ./ontologies:/app/ontologies:ro
    # Environment variables
    environment:
      - NODE_ENV=production
      - MCP_TRANSPORT=sse
      - PORT=3000
      - HOST=0.0.0.0
